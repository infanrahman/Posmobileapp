name: Mobile builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Check signing helper
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  android:
    name: Android test APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Name Android download
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr '+' '-')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/Rihla-POS-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rihla-android-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/Rihla-POS-*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS compile check (unsigned)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist)
          EXPECTED=$(sed -n 's/^version: //p' pubspec.yaml)
          test "$VERSION+$BUILD" = "$EXPECTED"
          echo "APP_VERSION=$VERSION-$BUILD" >> "$GITHUB_ENV"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && ditto -c -k --sequesterRsrc --keepParent Payload "Rihla-POS-$VERSION-build$BUILD-unsigned.ipa")
          echo "Packaged Rihla POS $VERSION (build $BUILD), commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'This is an unsigned IPA. Sign it with an Apple account using a sideloading tool, or use the Signed iOS IPA workflow with an active paid Apple Developer Program membership.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rihla-ios-${{ env.APP_VERSION }}-UNSIGNED-${{ github.run_number }}
          path: build/ios/ipa/Rihla-POS-*.ipa
          if-no-files-found: error
          retention-days: 14
